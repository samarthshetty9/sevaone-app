name: sevaone_app
description: Simulated SevaOne citizen app demo (no backend).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-700.ttf
          weight: 700
    - family: NotoKannada
      fonts:
        - asset: assets/fonts/NotoKannada-400.ttf
          weight: 400
        - asset: assets/fonts/NotoKannada-600.ttf
          weight: 600
